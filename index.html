<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PMO · Análise Integrada de Iniciativas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
<style>

:root {
 /* Paleta Corporativa Executiva */
 --bg: #f3f4f6;
 --surface: #ffffff;
 --surface2: #f8fafc;
 --surface3: #eef0f4;
 --border: #e2e8f0;
 --border2: #cbd5e1;
 --text: #1e293b;
 --muted: #64748b;
 --dim: #94a3b8;

 /* Vinho Corporativo (cor primária absoluta) */
 --red: #84231a;
 --red2: #a02c21;
 --red-dim: rgba(132,35,26,.08);
 --red-border: rgba(132,35,26,.25);
 /* Mantém aliases para compatibilidade com componentes existentes */
 --blue: #84231a;
 --blue-dim: rgba(132,35,26,.08);
 --blue-border: rgba(132,35,26,.25);
 --purple: #84231a;
 --purple-dim: rgba(132,35,26,.08);
 --purple-border: rgba(132,35,26,.25);

 /* Status semáforo */
 --green: #16a34a;
 --green-dim: rgba(22,163,74,.1);
 --green-border: rgba(22,163,74,.25);
 --amber: #d97706;
 --amber-dim: rgba(217,119,6,.1);
 --amber-border: rgba(217,119,6,.25);

 --font-display: 'Poppins', sans-serif;
 --font-body: 'Poppins', sans-serif;
 --font-mono: 'DM Mono', monospace;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
 font-family: var(--font-body);
 background: var(--bg);
 color: var(--text);
 min-height: 100vh;
 line-height: 1.6;
}

/* ── NOISE TEXTURE ── */
body::before {
 content: '';
 position: fixed;
 inset: 0;
 background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.035'/%3E%3C/svg%3E");
 pointer-events: none;
 z-index: 0;
}

/* ── LAYOUT ── */
.app { position: relative; z-index: 1; max-width: 900px; margin: 0 auto; padding: 32px 20px 80px; }

/* ── HEADER ── */
.header { text-align: center; margin-bottom: 56px; }
.header-eyebrow {
 display: inline-flex; align-items: center; gap: 8px;
 font-family: var(--font-mono); font-size: 11px; letter-spacing: 2px;
 text-transform: uppercase; color: var(--muted);
 border: 1px solid var(--border2); border-radius: 20px;
 padding: 5px 14px; margin-bottom: 20px;
}
.header-eyebrow span { width: 6px; height: 6px; border-radius: 50%; background: var(--red); display: inline-block; }
.header h1 {
 font-family: var(--font-display);
 font-size: clamp(32px, 5vw, 52px);
 font-weight: 400;
 line-height: 1.1;
 color: var(--text);
 margin-bottom: 12px;
}
.header h1 em { font-style: italic; color: var(--red); }
.header p { font-size: 15px; color: var(--muted); max-width: 480px; margin: 0 auto; }

/* ── PROGRESS STEPPER ── */
.stepper {
 display: flex; align-items: center; justify-content: center;
 gap: 0; margin-bottom: 48px;
}
.step-item { display: flex; align-items: center; gap: 0; }
.step-circle {
 width: 36px; height: 36px; border-radius: 50%;
 border: 1px solid var(--border2);
 background: var(--surface);
 display: flex; align-items: center; justify-content: center;
 font-family: var(--font-mono); font-size: 11px; font-weight: 500;
 color: var(--muted); transition: all .3s ease; cursor: default;
 position: relative; z-index: 1;
}
.step-circle.active { border-color: var(--red); color: var(--red); background: var(--blue-dim); box-shadow: 0 0 0 4px rgba(132,35,26,.08); }
.step-circle.done { border-color: var(--green); color: var(--green); background: var(--green-dim); }
.step-label { font-size: 11px; color: var(--muted); margin: 0 6px; white-space: nowrap; font-weight: 500; }
.step-label.active { color: var(--red); }
.step-label.done { color: var(--green); }
.step-connector { width: 40px; height: 1px; background: var(--border2); margin: 0 4px; }
.step-connector.done { background: var(--green); }

/* ── CARD ── */
.card {
 background: var(--surface);
 border: 1px solid var(--border);
 border-radius: 16px;
 overflow: hidden;
 margin-bottom: 24px;
}
.card-header {
 padding: 20px 24px;
 border-bottom: 1px solid var(--border);
 display: flex; align-items: center; gap: 12px;
}
.card-icon {
 width: 36px; height: 36px; border-radius: 9px;
 display: flex; align-items: center; justify-content: center;
 font-size: 16px; flex-shrink: 0;
}
.card-header h2 { font-family: var(--font-display); font-size: 18px; font-weight: 400; }
.card-header p { font-size: 11px; color: var(--muted); margin-top: 2px; }
.card-body { padding: 24px; }

/* ── PHASE BADGE ── */
.phase-badge {
 display: inline-flex; align-items: center; gap: 6px;
 font-family: var(--font-mono); font-size: 9.5px; letter-spacing: 1.5px;
 text-transform: uppercase; padding: 3px 10px; border-radius: 4px;
 font-weight: 500;
}
.phase-badge.strat { background: var(--blue-dim); color: var(--red); border: 1px solid var(--blue-border); }
.phase-badge.pmo { background: var(--red-dim); color: var(--red); border: 1px solid var(--red-border); }

/* ── FORM FIELDS ── */
.fields-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 0; }
.fields-grid .span2 { grid-column: 1 / -1; }
.field label {
 display: block; font-size: 10px; font-weight: 600;
 letter-spacing: 1.2px; text-transform: uppercase;
 color: var(--muted); margin-bottom: 6px;
}
.field input, .field select, .field textarea {
 width: 100%; background: var(--surface2); border: 1px solid var(--border2);
 border-radius: 8px; padding: 10px 13px;
 color: var(--text); font-family: var(--font-body); font-size: 13px;
 outline: none; transition: border-color .2s;
}
.field input:focus, .field select:focus, .field textarea:focus { border-color: var(--red); }
.field textarea { resize: none; min-height: 60px; }

/* ── SECTION SEPARATOR ── */
.dim-sep {
 display: flex; align-items: center; gap: 10px;
 margin: 20px 0 14px;
}
.dim-line { flex: 1; height: 1px; background: var(--border); }
.dim-label {
 font-family: var(--font-mono); font-size: 9px; font-weight: 500;
 letter-spacing: 1.5px; text-transform: uppercase;
 padding: 4px 12px; border-radius: 20px;
}
.dim-label.strat { color: var(--red); background: var(--blue-dim); border: 1px solid var(--blue-border); }
.dim-label.pmo { color: var(--red); background: var(--red-dim); border: 1px solid var(--red-border); }

/* ── QUESTION ROW ── */
.q-row {
 display: flex; align-items: flex-start; gap: 12px;
 padding: 12px 0; border-bottom: 1px solid var(--border);
}
.q-row:last-child { border-bottom: none; }
.q-num {
 flex-shrink: 0; width: 28px; height: 22px; border-radius: 5px;
 display: flex; align-items: center; justify-content: center;
 font-family: var(--font-mono); font-size: 9px; font-weight: 500;
}
.q-num.strat { background: var(--blue-dim); color: var(--red); border: 1px solid var(--blue-border); }
.q-num.pmo { background: var(--red-dim); color: var(--red); border: 1px solid var(--red-border); }
.q-num.pmo-sust { background: var(--green-dim); color: var(--green); border: 1px solid var(--green-border); }
.q-body { flex: 1; min-width: 0; }
.q-meta {
 font-size: 9px; color: var(--muted); font-weight: 600;
 letter-spacing: .8px; text-transform: uppercase;
 margin-bottom: 3px; display: flex; align-items: center; gap: 6px;
}
.trigger-tag {
 background: var(--amber-dim); color: var(--amber);
 border: 1px solid var(--amber-border);
 border-radius: 3px; padding: 1px 5px;
 font-size: 8px; font-weight: 700; letter-spacing: .5px;
}
.q-text { font-size: 13px; color: var(--muted); line-height: 1.5; }
.q-btns { display: flex; gap: 4px; flex-shrink: 0; margin-top: 2px; }
.btn-ans {
 padding: 5px 10px; border-radius: 6px; font-size: 10.5px; font-weight: 600;
 border: 1px solid var(--border2); background: transparent;
 color: var(--muted); cursor: pointer; transition: all .15s;
 font-family: var(--font-body);
}
.btn-ans:hover { border-color: var(--red); color: var(--text); }
.btn-ans.a-sim { background: var(--green-dim); border-color: var(--green-border); color: var(--green); }
.btn-ans.a-par { background: var(--amber-dim); border-color: var(--amber-border); color: var(--amber); }
.btn-ans.a-nao { background: var(--red-dim); border-color: var(--red-border); color: var(--red); }

.justif-wrap { margin: 6px 0 0 40px; display: none; }
.justif-wrap textarea {
 width: 100%; background: var(--surface2); border: 1px solid var(--border2);
 border-radius: 6px; padding: 7px 10px; color: var(--muted);
 font-family: var(--font-body); font-size: 11.5px; outline: none;
 resize: none; min-height: 36px;
}
.justif-wrap textarea:focus { border-color: var(--red); }

/* ── SCORE PANEL ── */
.score-panel {
 display: grid; grid-template-columns: 1fr 1fr 1fr;
 gap: 12px; margin-bottom: 16px;
}
.score-box {
 background: var(--surface2); border: 1px solid var(--border);
 border-radius: 12px; padding: 14px 16px;
}
.score-box-label { font-size: 9.5px; color: var(--muted); font-weight: 600; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 6px; }
.score-box-val { font-family: var(--font-display); font-size: 28px; line-height: 1; }
.score-box-sub { font-size: 10px; color: var(--muted); margin-top: 4px; }
.bar-track { height: 3px; background: var(--border); border-radius: 2px; margin-top: 8px; overflow: hidden; }
.bar-fill { height: 100%; border-radius: 2px; transition: width .5s ease; }

/* ── NAV BUTTONS ── */
.nav-row { display: flex; justify-content: space-between; align-items: center; margin-top: 28px; gap: 12px; }
.btn {
 padding: 11px 24px; border-radius: 9px; font-size: 13px; font-weight: 600;
 border: none; cursor: pointer; font-family: var(--font-body); transition: all .2s;
}
.btn-primary { background: var(--red); color: #fff; }
.btn-primary:hover { background: #a02c21; transform: translateY(-1px); }
.btn-primary:disabled { background: var(--border2); color: var(--muted); cursor: not-allowed; transform: none; }
.btn-secondary { background: var(--surface2); border: 1px solid var(--border2); color: var(--muted); }
.btn-secondary:hover { border-color: var(--border2); color: var(--text); }
.btn-hint { font-size: 10.5px; color: var(--amber); margin-top: 4px; text-align: right; }

/* ── RESULT CARD ── */
.result-hero {
 border-radius: 16px; padding: 32px;
 border: 1px solid var(--border); margin-bottom: 24px;
 position: relative; overflow: hidden;
}
.result-hero::before {
 content: ''; position: absolute; inset: 0;
 background: radial-gradient(ellipse at top left, var(--glow-color, rgba(132,35,26,.08)) 0%, transparent 70%);
 pointer-events: none;
}
.result-hero.r-projeto { --glow-color: rgba(132,35,26,.08); border-color: var(--blue-border); }
.result-hero.r-sustentacao { --glow-color: rgba(62,207,142,.1); border-color: var(--green-border); }
.result-hero.r-melhoria { --glow-color: rgba(245,166,35,.1); border-color: var(--amber-border); }
.result-hero.r-pmo { --glow-color: rgba(132,35,26,.08); border-color: var(--purple-border); }
.result-hero.r-bloqueado { --glow-color: rgba(240,96,96,.1); border-color: var(--red-border); }

.result-eyebrow { font-family: var(--font-mono); font-size: 9.5px; letter-spacing: 1.8px; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
.result-title { font-family: var(--font-display); font-size: 42px; font-weight: 400; line-height: 1; margin-bottom: 10px; }
.result-sub { font-size: 13px; color: var(--muted); line-height: 1.6; margin-bottom: 20px; max-width: 560px; }
.result-action {
 display: inline-flex; align-items: center; gap: 8px;
 font-size: 12px; font-weight: 600; padding: 8px 16px;
 border-radius: 7px; border: 1px solid;
}
.result-action.obrig { background: var(--red-dim); border-color: var(--red-border); color: var(--red); }
.result-action.livre { background: var(--green-dim); border-color: var(--green-border); color: var(--green); }

/* ── MATRIX ── */
.matrix-wrap { margin-bottom: 24px; }
.matrix-title { font-family: var(--font-display); font-size: 18px; margin-bottom: 16px; }
.matrix-grid {
 display: grid;
 grid-template-columns: 100px 1fr 1fr 1fr 1fr;
 gap: 4px;
}
.matrix-cell {
 padding: 10px 12px; border-radius: 8px;
 background: var(--surface2); border: 1px solid var(--border);
 font-size: 11px; text-align: center; line-height: 1.4;
}
.matrix-cell.header-col { background: transparent; border-color: transparent; font-size: 10px; font-weight: 700; color: var(--muted); letter-spacing: .8px; text-transform: uppercase; display: flex; align-items: center; justify-content: flex-end; text-align: right; }
.matrix-cell.header-row { background: transparent; border-color: transparent; font-size: 10px; font-weight: 700; color: var(--muted); letter-spacing: .8px; text-transform: uppercase; display: flex; align-items: center; justify-content: center; }
.matrix-cell.highlight { border-width: 2px; font-weight: 700; transform: scale(1.03); box-shadow: 0 4px 20px rgba(0,0,0,.3); }
.matrix-cell.c-max { background: rgba(132,35,26,.08); border-color: var(--blue-border); color: var(--red); }
.matrix-cell.c-high { background: rgba(62,207,142,.12); border-color: var(--green-border); color: var(--green); }
.matrix-cell.c-mid { background: rgba(245,166,35,.1); border-color: var(--amber-border); color: var(--amber); }
.matrix-cell.c-low { background: rgba(240,96,96,.08); border-color: var(--red-border); color: var(--red); }

/* ── SCORES SUMMARY ── */
.scores-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 24px; }
.score-summary-box {
 background: var(--surface2); border: 1px solid var(--border);
 border-radius: 12px; padding: 16px 18px;
}
.score-summary-label { font-size: 10px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; }
.score-summary-val { font-family: var(--font-display); font-size: 36px; margin-bottom: 4px; }
.score-summary-detail { font-size: 11px; color: var(--muted); }

/* ── RECOMMENDATIONS ── */
.recs-wrap { background: var(--surface2); border: 1px solid var(--border); border-radius: 12px; padding: 20px 22px; margin-bottom: 24px; }
.recs-title { font-family: var(--font-display); font-size: 16px; margin-bottom: 14px; }
.rec-item { display: flex; gap: 10px; margin-bottom: 10px; font-size: 12.5px; color: #9aaab8; line-height: 1.6; }
.rec-item:last-child { margin-bottom: 0; }
.rec-arrow { color: var(--red); font-weight: 700; flex-shrink: 0; margin-top: 1px; }

/* ── ALERTS ── */
.alert {
 padding: 10px 14px; border-radius: 8px; font-size: 11.5px;
 margin-bottom: 10px; display: flex; gap: 8px; align-items: flex-start; line-height: 1.5;
}
.alert.info { background: var(--blue-dim); border: 1px solid var(--blue-border); color: #93c5fd; }
.alert.warn { background: var(--amber-dim); border: 1px solid var(--amber-border); color: #fcd34d; }
.alert.success { background: var(--green-dim); border: 1px solid var(--green-border); color: #6ee7b7; }
.alert.danger { background: var(--red-dim); border: 1px solid var(--red-border); color: #fca5a5; }
.alert.block { background: var(--red-dim); border: 1px solid var(--red-border); color: #fca5a5; font-size: 13px; padding: 14px 18px; }

/* ── BLOQUEIO ESTRATÉGICO ── */
.block-screen {
 text-align: center; padding: 48px 24px;
 background: var(--surface2); border: 1px solid var(--red-border);
 border-radius: 16px; margin-bottom: 24px;
}
.block-icon { font-size: 48px; margin-bottom: 16px; }
.block-title { font-family: var(--font-display); font-size: 28px; margin-bottom: 10px; color: var(--red); }
.block-desc { font-size: 13px; color: var(--muted); max-width: 480px; margin: 0 auto 20px; line-height: 1.7; }

/* ── PHASE TRANSITION ── */
.phase-transition {
 text-align: center; padding: 32px;
 background: linear-gradient(135deg, rgba(132,35,26,.05), rgba(132,35,26,.03));
 border: 1px solid var(--blue-border); border-radius: 16px;
 margin-bottom: 24px;
}
.phase-transition h3 { font-family: var(--font-display); font-size: 22px; margin-bottom: 8px; }
.phase-transition p { font-size: 13px; color: var(--muted); max-width: 460px; margin: 0 auto 20px; }

/* ── PROGRESS BAR GERAL ── */
.global-progress { margin-bottom: 32px; }
.gp-row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; }
.gp-label { font-size: 11px; color: var(--muted); font-weight: 600; letter-spacing: .5px; }
.gp-pct { font-family: var(--font-mono); font-size: 13px; color: var(--red); }
.gp-track { height: 3px; background: var(--border); border-radius: 2px; overflow: hidden; }
.gp-fill { height: 100%; background: linear-gradient(90deg, var(--red), var(--red2)); border-radius: 2px; transition: width .4s ease; }

/* ── BREAKDOWN ── */
.breakdown { display: flex; flex-direction: column; gap: 8px; }
.bk-row { display: flex; align-items: center; gap: 10px; }
.bk-label { font-size: 11px; color: var(--muted); width: 130px; flex-shrink: 0; }
.bk-track { flex: 1; height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; }
.bk-fill { height: 100%; border-radius: 2px; transition: width .4s ease; }
.bk-val { font-family: var(--font-mono); font-size: 11px; width: 30px; text-align: right; flex-shrink: 0; }

/* ── STICKY SIDE PANEL ── */
.layout { display: grid; grid-template-columns: 1fr 280px; gap: 20px; align-items: start; }
.col-main { display: flex; flex-direction: column; gap: 0; }
.col-side { position: sticky; top: 20px; display: flex; flex-direction: column; gap: 14px; }
.side-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
.side-card h4 { font-size: 11px; font-weight: 700; letter-spacing: .8px; text-transform: uppercase; color: var(--muted); margin-bottom: 12px; }

/* ── PHASE INDICATOR ── */
.phase-indicator {
 display: flex; align-items: center; gap: 8px;
 padding: 10px 14px; border-radius: 9px;
 font-size: 12px; font-weight: 600; margin-bottom: 14px;
}
.phase-indicator.strat { background: var(--blue-dim); border: 1px solid var(--blue-border); color: var(--red); }
.phase-indicator.pmo { background: var(--purple-dim); border: 1px solid var(--purple-border); color: var(--purple); }

/* ── DIVIDER ── */
hr.div { border: none; border-top: 1px solid var(--border); margin: 20px 0; }

/* ── ANIM ── */
.fade-in { animation: fadeIn .4s ease; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

@media (max-width: 720px) {
 .layout { grid-template-columns: 1fr; }
 .col-side { position: static; }
 .score-panel { grid-template-columns: 1fr 1fr; }
 .fields-grid { grid-template-columns: 1fr; }
 .scores-row { grid-template-columns: 1fr; }
 .matrix-grid { grid-template-columns: 80px 1fr 1fr 1fr 1fr; font-size: 10px; }
}


/* ── LIGHT MODE ── */
[data-theme="light"] {
 --bg: #f5f7fa;
 --surface: #ffffff;
 --surface2: #f0f2f5;
 --surface3: #e8ebf0;
 --border: #d1d5db;
 --border2: #c4cad4;
 --text: #1a1d23;
 --muted: #5a6474;
 --dim: #8896a6;

 --blue: #84231a;
 --blue-dim: rgba(37,99,235,.08);
 --blue-border: rgba(37,99,235,.2);
 --green: #059669;
 --green-dim: rgba(5,150,105,.08);
 --green-border: rgba(5,150,105,.2);
 --amber: #d97706;
 --amber-dim: rgba(217,119,6,.08);
 --amber-border: rgba(217,119,6,.2);
 --red: #dc2626;
 --red-dim: rgba(220,38,38,.06);
 --red-border: rgba(220,38,38,.2);
 --purple: #84231a;
 --purple-dim: rgba(132,35,26,.08);
 --purple-border: rgba(132,35,26,.25);
}
[data-theme="light"] body::before { display: none; }
[data-theme="light"] .alert.info { color: #1e40af; }
[data-theme="light"] .alert.warn { color: #92400e; }
[data-theme="light"] .alert.success { color: #065f46; }
[data-theme="light"] .alert.danger { color: #991b1b; }
[data-theme="light"] .q-text { color: #374151; }
[data-theme="light"] .rec-item { color: #4b5563; }

/* ── THEME TOGGLE ── */
.theme-toggle {
 position: fixed;
 top: 20px;
 right: 24px;
 z-index: 100;
 display: flex;
 align-items: center;
 gap: 8px;
 background: var(--surface);
 border: 1px solid var(--border);
 border-radius: 24px;
 padding: 6px 10px;
 cursor: pointer;
 user-select: none;
 transition: all .3s ease;
 box-shadow: 0 2px 12px rgba(0,0,0,.15);
}
.theme-toggle:hover { border-color: var(--blue-border); box-shadow: 0 2px 16px rgba(0,0,0,.25); }
.theme-icon { font-size: 16px; line-height: 1; transition: opacity .3s; }
.theme-icon.inactive { opacity: .35; }
.toggle-track {
 width: 40px; height: 22px;
 background: var(--surface3);
 border: 1px solid var(--border2);
 border-radius: 11px;
 position: relative;

const PMO_PROJ = [

];

const PMO_SUST = [
 { id:'S1', dim:'Recorrência/Correção', text:'Trata-se de iniciativa recorrente, corretiva ou rotineira?', peso:10 },
 { id:'S2', dim:'Capacidade da Área', text:'Pode ser atendida pela capacidade da área sem governança robusta?', peso:9 },

];

function gerarProtocolo() {
  var ano = new Date().getFullYear();
  var seq = String(Math.floor(Math.random() * 9000) + 1000);
  return ano + '-' + seq; // Formato temporário — futuramente a API fornecerá o sequencial correto
}

function freshState() {
 return {
 step: 0,
 info: { nome:'', area:'', categoria:'', gestor:'', resp:'', desc:'', id_protocolo: gerarProtocolo(), classificacao:'', investimento:'', tipoBeneficio:'', receita:'', duracaoBeneficio:'', beneficioTotal:'', temPayback:'sim', payback:'', percentualRefinamento:'', just_investimento:'', data:'' },
 strat: {}, // { O1:'sim', O2:'par', F1:'nao', ... } — all strat answers in one object
 stratJust: {},
 pmo: {}, // { P1:'sim', S1:'nao', ... }
 pmoJust: {},
 _blocked: false,
 _withRessalva: false,
 _saved: false,
 _saving: false,
 };
}
var S = freshState();

// ── RASCUNHO AUTOMÁTICO ──────────────────────────────────────────────
var DRAFT_KEY = 'pmo_draft_v2';
function saveDraft() {
  try { localStorage.setItem(DRAFT_KEY, JSON.stringify({ ts:Date.now(), s:{ info:S.info, strat:S.strat, stratJust:S.stratJust, pmo:S.pmo, pmoJust:S.pmoJust, step:S.step }})); } catch(e) {}
}
function loadDraft() {
  try {
    var raw = localStorage.getItem(DRAFT_KEY);
    if (!raw) return false;
    var d = JSON.parse(raw);
    if (Date.now() - d.ts > 86400000) { localStorage.removeItem(DRAFT_KEY); return false; }
    Object.assign(S.info, d.s.info||{}); Object.assign(S.strat, d.s.strat||{});
    Object.assign(S.stratJust, d.s.stratJust||{}); Object.assign(S.pmo, d.s.pmo||{});
    Object.assign(S.pmoJust, d.s.pmoJust||{}); S.step = d.s.step||0;
    return true;
  } catch(e) { return false; }
}
function clearDraft() { try { localStorage.removeItem(DRAFT_KEY); } catch(e) {} }

// ── SCORE CACHE (evita 9 chamadas redundantes) ────────────────────────
function getStrat() { if (!S._sc) S._sc = calcStrat(); return S._sc; }
function getPMO()   { if (!S._pc) S._pc = calcPMO();   return S._pc; }
function invalidateScoreCache() { S._sc = null; S._pc = null; }

// ── DEBOUNCE painel lateral ───────────────────────────────────────────
var _sideDebounce;
function refreshSidePanelDebounced() {
  clearTimeout(_sideDebounce);
  _sideDebounce = setTimeout(refreshSidePanel, 200);
}
function v(x){return(x===undefined||x===null||x==='undefined'||x==='null')?'':x;}

// Sanitiza texto livre antes de inserir via innerHTML/atributos, evitando que
// caracteres como " < > quebrem o HTML ou permitam injeção de script (XSS).
function esc(x) {
  x = v(x);
  return String(x)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

// ═══════════════════════════════════════
// SCORING
// ═══════════════════════════════════════

function calcStrat() {
 var objTotal = 0;
 OBJECTIVES.forEach(function(o) {
 var a = S.strat[o.id];
 objTotal += a === 'sim' ? 100 : a === 'par' ? 50 : 0;
 });
 var objScore = Math.round((objTotal / (OBJECTIVES.length * 100)) * 100);

 var fcsTotal = 0, fcsCov = 0;
 FCS_ITEMS.forEach(function(f) {
 var a = S.strat[f.id];
 fcsTotal += a === 'sim' ? 6 : a === 'par' ? 3 : 0;
 fcsCov += a === 'sim' ? 1 : a === 'par' ? 0.5 : 0;
 });
 var fcsScore = Math.round((fcsTotal / (FCS_ITEMS.length * 6)) * 100);

 var aveTotal = 0, aveCov = 0;
 AVENUES.forEach(function(a) {
 var v = S.strat[a.id];
 aveTotal += v === 'sim' ? 100 : v === 'par' ? 50 : 0;
 aveCov += v === 'sim' ? 1 : v === 'par' ? 0.5 : 0;
 });
 var aveScore = Math.round(aveTotal / AVENUES.length);
 var finalScore = Math.round(objScore * 0.45 + fcsScore * 0.30 + aveScore * 0.25);

 return { objScore:objScore, fcsScore:fcsScore, fcsCov:fcsCov, aveScore:aveScore, aveCov:aveCov, finalScore:finalScore };
}

function calcPMO() {
 var proj = 0, sust = 0, triggers = 0, parciais = 0, respondidas = 0;
 PMO_PROJ.forEach(function(q) {
 var a = S.pmo[q.id];
 if (a) { respondidas++; if (a === 'par') parciais++; }
 proj += a === 'sim' ? q.peso : a === 'par' ? q.peso / 2 : 0;
 if (q.trigger && a === 'sim') triggers++;
 });
 PMO_SUST.forEach(function(q) {
 var a = S.pmo[q.id];
 if (a) { respondidas++; if (a === 'par') parciais++; }
 sust += a === 'sim' ? q.peso : a === 'par' ? q.peso / 2 : 0;
 });
 return { proj:proj, sust:sust, triggers:triggers, parciais:parciais, respondidas:respondidas };
}

function classifyPMO(proj, sust, triggers, parciais, respondidas) {
 if (respondidas < 4) return 'vazio';
 if ((proj >= 45 && triggers >= 3) || (proj >= 38 && sust <= 18)) return 'projeto';
 if (sust >= 28 && proj < 25) return 'sustentacao';
 if ((proj >= 25 && sust >= 20) || parciais >= 4) return 'pmo';
 if (respondidas >= 8) return 'melhoria';
 return 'vazio';
}

function stratStatus(score) {
 if (score >= 80) return { label:'PRIORIDADE MÁXIMA', level:'max', color:'var(--green)' };
 if (score >= 60) return { label:'PRIORIDADE ALTA', level:'high', color:'var(--amber)' };
 if (score >= 40) return { label:'PRIORIDADE MÉDIA', level:'mid', color:'#f97316' };
 return { label:'BAIXO ALINHAMENTO', level:'low', color:'var(--red)' };
}

 max: {

 },

function autoResize(el) {
 el.style.height = 'auto';
 el.style.height = Math.max(36, el.scrollHeight) + 'px';
}

function parseMoneyVal(s) {
  if (!s) return NaN;
  s = String(s).trim().replace(/R\$/gi,'').replace(/\s/g,'');
  if (s.includes(',')) s = s.replace(/\./g,'').replace(',','.');
  return parseFloat(s);
}

function formatMoneyInput(el, stateKey) {
  var raw = el.value.replace(/\D/g,'');
  if (!raw) { el.value=''; S.info[stateKey]=''; calcPayback(); return; }
  var num = parseInt(raw,10) / 100;
  el.value = 'R$ ' + num.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
  S.info[stateKey] = el.value;
  if (stateKey === 'receita') calcBeneficioTotal();
  calcPayback();
}

function calcBeneficioTotal() {
  var rec = parseMoneyVal(S.info.receita);
  var dur = parseInt(S.info.duracaoBeneficio)||0;
  var totalEl = document.getElementById('fi-beneficio-total');
  if (!totalEl) return;
  if (!isNaN(rec) && rec > 0 && dur > 0) {
    var total = rec * dur;
    S.info.beneficioTotal = total.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
    totalEl.textContent = 'Total estimado: R$ ' + total.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}) + ' em ' + dur + ' meses';
    totalEl.style.color = 'var(--green)';
  } else {
    totalEl.textContent = dur > 0 ? 'Informe o valor mensal para calcular o total' : 'Informe a duração para calcular o benefício total';
    totalEl.style.color = 'var(--muted)';
    S.info.beneficioTotal = '';
  }
}

  var chkNao = S.info.temPayback === 'nao' ? 'checked' : '';
  var inpStyle = 'accent-color:var(--red);width:16px;height:16px';
  var lblStyle = 'display:flex;align-items:center;gap:8px;cursor:pointer;font-size:13px;font-weight:400';
  return '<div class="field span2" style="background:var(--surface2);border:1px solid var(--border2);border-radius:10px;padding:14px 16px">'

    + '<div style="display:flex;gap:20px;align-items:center">'
    + '<label style="' + lblStyle + '"><input type="radio" name="tem-payback" value="sim" ' + chkSim + ' onchange="togglePayback()" style="' + inpStyle + '"/> Sim</label>'
    + '<label style="' + lblStyle + '"><input type="radio" name="tem-payback" value="nao" ' + chkNao + ' onchange="togglePayback()" style="' + inpStyle + '"/> Não</label>'

function setPbManual(el) {
  el.dataset.manual = 'true';
  S.info.payback = el.value;
  // Atualiza legenda para refletir o valor digitado manualmente
  var calcEl = document.getElementById('fi-payback-calc');
  if (calcEl) {
    if (el.value) {
      calcEl.textContent = 'Valor definido manualmente: ' + el.value + ' meses';
      calcEl.style.color = 'var(--amber)';
    } else {
      calcEl.textContent = '';
    }
  }
}

function paybackFieldHtml() {
  var display = S.info.temPayback === 'nao' ? 'display:none' : '';
  var inpStyle = 'width:100%;background:var(--surface2);border:1px solid var(--border2);border-radius:8px;padding:10px 13px;color:var(--text);font-family:var(--font-body);font-size:13px;outline:none;transition:border-color .2s';
  var html = '<div id="payback-wrap" class="field" style="' + display + '">';
  html += '<label>Payback Estimado</label>';
  html += '<div style="display:flex;gap:8px;align-items:center">';
  html += '<input type="number" id="fi-payback" min="0" value="' + (S.info.payback||'') + '" placeholder="Ex: 18" oninput="setPbManual(this)" style="' + inpStyle + '"/>';
  html += '<span style="white-space:nowrap;font-size:12px;color:var(--muted);min-width:42px">meses</span>';
  html += '</div><div id="fi-payback-calc" style="font-size:10px;color:var(--muted);margin-top:4px"></div></div>';
  return html;
}

function togglePayback() {
  S.info.temPayback = document.querySelector('input[name="tem-payback"]:checked')?.value || 'sim';
  var pbWrap = document.getElementById('payback-wrap');
  if (!pbWrap) return;
  if (S.info.temPayback === 'nao') {
    pbWrap.style.display = 'none';
    S.info.payback = '';
    var pb = document.getElementById('fi-payback');
    if (pb) { pb.value=''; pb.dataset.manual='false'; }
    var calc = document.getElementById('fi-payback-calc');
    if (calc) calc.textContent = '';
  } else {
    pbWrap.style.display = 'block';
    calcPayback();
  }
}

function getBeneficioLabel() {
  var t = S.info.tipoBeneficio;
  if (t === 'reducao')  return 'Redução Mensal Estimada (R$)';
  if (t === 'evitado')  return 'Custo Evitado Mensal Estimado (R$)';
  if (t === 'saving')   return 'Saving Mensal Estimado (R$)';
  return 'Receita Mensal Estimada (R$)';
}

function updateBeneficioLabel() {
  var lbl = document.getElementById('fi-beneficio-label');
  if (lbl) lbl.textContent = getBeneficioLabel();
}

function calcPayback() {
  if (S.info.temPayback === 'nao') return;
  var inv = parseMoneyVal(S.info.investimento);
  var rec = parseMoneyVal(S.info.receita);
  var calcEl = document.getElementById('fi-payback-calc');
  var pbInput = document.getElementById('fi-payback');
  if (!calcEl || !pbInput) return;
  if (!isNaN(inv) && inv > 0 && !isNaN(rec) && rec > 0) {
    var meses = Math.round(inv / rec);
    calcEl.textContent = 'Calculado: ' + meses + ' meses · ajuste se necessário';
    calcEl.style.color = 'var(--amber)';
    if (!pbInput.dataset.manual || pbInput.dataset.manual === 'false') {
      pbInput.value = meses;
      S.info.payback = String(meses);
    }
  } else {
    calcEl.textContent = 'Preencha Investimento e Benefício Mensal para calcular automaticamente';
    calcEl.style.color = 'var(--muted)';
  }
}

function setAns(id, val) {
 // Determine which state object
 if (id.charAt(0) === 'O' || id.charAt(0) === 'F' || id.charAt(0) === 'A') {
 S.strat[id] = val;
 } else {
 S.pmo[id] = val;
 }
 // Invalida cache — força recálculo no próximo getStrat()/getPMO()
 invalidateScoreCache();
 // Update button styles
 ['sim','par','nao'].forEach(function(v) {
 var b = document.getElementById('rb-' + id + '-' + v);
 if (b) b.className = 'btn-ans' + (v === val ? ' a-' + val : '');
 });
 // Show/hide justif
 var jw = document.getElementById('jw-' + id);
 if (jw) jw.style.display = (val === 'sim' || val === 'par') ? 'block' : 'none';
 // Update live panel & button
 saveDraft();
 refreshSidePanel();
}

function setJust(id, val) {
 if (id.charAt(0) === 'O' || id.charAt(0) === 'F' || id.charAt(0) === 'A') {
 S.stratJust[id] = val;
 } else {
 S.pmoJust[id] = val;
 }
}

function isStratComplete() {
 var all = OBJECTIVES.concat(FCS_ITEMS).concat(AVENUES);
 for (var i = 0; i < all.length; i++) {
 if (!S.strat[all[i].id]) return false;
 }
 return true;
}

function isPMOComplete() {
 var all = PMO_PROJ.concat(PMO_SUST);
 for (var i = 0; i < all.length; i++) {
 if (!S.pmo[all[i].id]) return false;
 }
 return true;
}

function refreshSidePanel() {
 if (S.step === 1) {
 var sc = getStrat();
 var totalQ = OBJECTIVES.length + FCS_ITEMS.length + AVENUES.length;
 var answered = 0;
 OBJECTIVES.concat(FCS_ITEMS).concat(AVENUES).forEach(function(i) { if (S.strat[i.id]) answered++; });
 var pct = Math.round((answered / totalQ) * 100);
 var col = sc.finalScore >= 70 ? 'var(--green)' : sc.finalScore >= 40 ? 'var(--amber)' : 'var(--red)';

 var el = function(x) { return document.getElementById(x); };
 if (el('live-final')) { el('live-final').textContent = sc.finalScore; el('live-final').style.color = col; }
 if (el('live-obj')) el('live-obj').textContent = sc.objScore + '%';
 if (el('live-fcs')) el('live-fcs').textContent = sc.fcsScore + '%';
 if (el('live-ave')) el('live-ave').textContent = sc.aveScore + '%';
 if (el('live-prog-pct')) el('live-prog-pct').textContent = pct + '%';
 if (el('live-prog-fill')) el('live-prog-fill').style.width = pct + '%';

 // Button
 var btn = el('btn-strat-next');
 if (btn) btn.disabled = !isStratComplete();

 // Status text
 if (el('strat-status') && isStratComplete()) {
 var st = stratStatus(sc.finalScore);
 el('strat-status').innerHTML = sc.finalScore < 40
 ? '<div class="alert danger">⚠️ Score ' + sc.finalScore + '/100 — Alinhamento insuficiente.</div>'
 : '<div class="alert success">Score ' + sc.finalScore + '/100 — ' + st.label + '. Pode avançar.</div>';
 }

 // Breakdown
 if (el('live-bk')) {
 var bk = '';
 [{l:'Objetivos',v:sc.objScore},{l:'FCS',v:sc.fcsScore},{l:'Avenidas',v:sc.aveScore}].forEach(function(b) {
 var c2 = b.v >= 70 ? 'var(--green)' : b.v >= 40 ? 'var(--amber)' : 'var(--red)';
 bk += '<div class="bk-row"><span class="bk-label">' + b.l + '</span><div class="bk-track"><div class="bk-fill" style="width:' + b.v + '%;background:' + c2 + '"></div></div><span class="bk-val" style="color:' + c2 + '">' + b.v + '</span></div>';
 });
 el('live-bk').innerHTML = bk;
 }
 }

 if (S.step === 2) {
 var p = getPMO();
 var el2 = function(x) { return document.getElementById(x); };
 if (el2('live-proj')) el2('live-proj').textContent = p.proj.toFixed(1) + '/76';
 if (el2('live-sust')) el2('live-sust').textContent = p.sust.toFixed(1) + '/40';
 if (el2('live-trg')) el2('live-trg').textContent = p.triggers + '/5';
 var total2 = PMO_PROJ.length + PMO_SUST.length;
 var pct2 = Math.round((p.respondidas / total2) * 100);
 if (el2('live-pmo-pct')) el2('live-pmo-pct').textContent = pct2 + '%';
 if (el2('live-pmo-prog')) el2('live-pmo-prog').style.width = pct2 + '%';
 var btn2 = el2('btn-pmo-next');
 if (btn2) btn2.disabled = !isPMOComplete();
 }
}

a empresa.", "F5": "Avalie se o projeto utiliza dados da empresa de forma estruturada para tomada de decisão, ou se gera dados que poderão ser aproveitados em análises futuras e inteligência de negócio.", "F6": "Considere se o projeto prevê ações de comunicação, treinamento e engajamento das pessoas impactadas, evitando resistência e garantindo a adoção efetiva das mudanças propostas.", "A1": "Avalie se o projeto cria condições concretas para conquistar clientes em segmentos, regiões ou nichos onde a empresa ainda não está presente ou tem presença marginal.", "A2": "Verifique se o projeto viabiliza ofertas complementares, pacotes de serviços ou upgrades que aumentem o valor médio das transações com clientes já existentes.", "A3": "Considere se o projeto tem impacto direto e mensurável na linha de custos — como redução de fornecedores, automação de processos caros ou eliminação de despesas recorrentes.", "A4": "Avalie se o projeto libera capacidade das equipes, acelera ciclos de trabalho ou permite que a mesma estrutura produza mais resultados sem aumento proporcional de recursos.", "P1": "Um projeto bem definido tem objetivo claro (o que se quer alcançar), escopo delimitado (o que está dentro e fora), data de início prevista e critério de encerramento estabelecido.", "P2": "Diferencia-se de uma atividade rotineira por produzir algo novo ou transformar uma realidade existente — um sistema, um processo, um produto ou uma capacidade organizacional.", "P3": "Requer coordenação ativa entre duas ou mais áreas, com dependências, papéis definidos e necessidade de alinhamento contínuo. Projetos de área única geralmente se enquadram como sustentação.", "P4": "O impacto deve ser tangível: receita, custo, risco, experiência do cliente, conformidade ou reputação. Iniciativas de baixo impacto tendem a se enquadrar como melhoria contínua.", "P5": "Avalie se a iniciativa requer um plano com datas, responsáveis, entregas intermediárias e acompanhamento sistemático — típico de projet function qRow(q, cssType) {
 var id = q.id;
 var isStrat = (id.charAt(0)==='O'||id.charAt(0)==='F'||id.charAt(0)==='A');
 var ans = isStrat ? S.strat[id] : S.pmo[id];
 var justVal = isStrat ? (S.stratJust[id]||'') : (S.pmoJust[id]||'');
 var showJust = (ans==='sim'||ans==='par') ? 'block' : 'none';
 var tip = TOOLTIPS[id] || '';
 var helpBtn = tip ? '<span class="q-help" data-tip="' + tip + '" onmouseenter="showTip(event,this)" onmouseleave="hideTip()"><i style="font-style:italic;font-family:Poppins,sans-serif">i</i></span>' : '';
 return '<div class="q-row">' +
 '<div class="q-num ' + cssType + '">' + (q.num || id) + '</div>' +
 '<div class="q-body">' +
 '<div class="q-meta">' + q.dim +
 (q.trigger ? ' <span class="trigger-tag">TRIGGER</span>' : '') +
 (q.peso ? ' <span style="color:var(--dim);font-size:9px">· peso ' + q.peso + '</span>' : '') +
 '</div>' +
 '<div class="q-text">' + (q.title ? '<strong style="color:var(--text)">' + q.title + '</strong><br>' + q.text + ' ' + helpBtn : q.text + ' ' + helpBtn) + '</div>' +
 '<div class="justif-wrap" id="jw-' + id + '" style="display:' + showJust + '">' +
 '<textarea placeholder="Descreva brevemente..." oninput="autoResize(this);setJust(\'' + id + '\',this.value)">' + esc(justVal) + '</textarea>' +
 '</div>' +
 '</div>' +
 '<div class="q-btns">' +
 '<button class="btn-ans' + (ans==='sim'?' a-sim':'') + '" id="rb-' + id + '-sim" onclick="setAns(\'' + id + '\',\'sim\')">Sim</button>' +
 '<button class="btn-ans' + (ans==='par'?' a-par':'') + '" id="rb-' + id + '-par" onclick="setAns(\'' + id + '\',\'par\')">Parcial</button>' +
 '<button class="btn-ans' + (ans==='nao'?' a-nao':'') + '" id="rb-' + id + '-nao" onclick="setAns(\'' + id + '\',\'nao\')">Não</button>' +
 '</div>' +
 '</div>';
}

function buildPayload() {
 var sc = getStrat();
 var p = getPMO();
 var cls = classifyPMO(p.proj, p.sust, p.triggers, p.parciais, p.respondidas);
 var stSt = stratStatus(sc.finalScore);
 var mat = (MATRIX[stSt.level]||{})[cls] || { text:'Indefinido', esc:false, acao:'' };
 var pmoLabels = { projeto:'PROJETO', sustentacao:'SUSTENTAÇÃO', melhoria:'MELHORIA CONTÍNUA', pmo:'AVALIAÇÃO PMO', vazio:'—' };
 var stratLevelLabels = { max:'Máxima (≥80)', high:'Alta (60–79)', mid:'Média (40–59)', low:'Baixa (<40)' };

 var mapGroup = function(ids, ansObj, justObj) {
 var out = {};
 ids.forEach(function(id) { out[id] = { resp: ansObj[id] || '', just: justObj[id] || '' }; });
 return out;
 };
 var stratIds = ['O1','O2','O3','O4','O5','O6','O7','F1','F2','F3','F4','F5','F6','A1','A2','A3','A4'];

 return {
 info: S.info,  // já inclui S.info.payback
 scores: { finalScore:sc.finalScore, objScore:sc.objScore, fcsScore:sc.fcsScore, aveScore:sc.aveScore, fcsCoverage:sc.fcsCov, aveCoverage:sc.aveCov, stratLevel:stratLevelLabels[stSt.level] },
 pmo: { enquadramento:pmoLabels[cls], scoreProj:parseFloat(p.proj.toFixed(1)), scoreSust:parseFloat(p.sust.toFixed(1)), triggers:p.triggers, parciais:p.parciais },
 result: { texto:mat.text, escalonamento:mat.esc, acao:mat.acao, bloqueioEstrategico:!!S._withRessalva },
 objetivos: mapGroup(['O1','O2','O3','O4','O5','O6','O7'], S.strat, S.stratJust),
 fcs: mapGroup(['F1','F2','F3','F4','F5','F6'], S.strat, S.stratJust),
 avenidas: mapGroup(['A1','A2','A3','A4'], S.strat, S.stratJust),
 projPMO: mapGroup(['P1','P2','P3','P4','P5','P6','P7','P8','P9','P10','P11','P12'], S.pmo, S.pmoJust),
 sustPMO: mapGroup(['S1','S2','S3','S4','S5'], S.pmo, S.pmoJust),
 };
}

function sendToSheets() {
  if (!APPS_SCRIPT_URL) return Promise.resolve({ ok:false, reason:'url_not_set' });

  var timeoutId;
  var timeoutPromise = new Promise(function(resolve) {
    timeoutId = setTimeout(function() {
      resolve({ ok:false, error:'Timeout — verifique se o GAS está implantado corretamente.' });
    }, 25000);
  });

  var fetchPromise = fetch(APPS_SCRIPT_URL, {
    method: 'POST',
    // 'text/plain' evita o preflight CORS (OPTIONS) que o Apps Script não trata bem
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ action: 'saveTriagem', data: buildPayload() })
  })
  .then(function(res) { return res.json(); })
  .then(function(resp) {
    clearTimeout(timeoutId);
    if (resp && resp.status === 'ok') return { ok:true, id: resp.id || '' };
    return { ok:false, error: resp ? (resp.message || 'Erro no servidor') : 'Resposta inválida' };
  })
  .catch(function() {
    clearTimeout(timeoutId);
    return { ok:false, error:'Falha de rede. Verifique a URL do GAS e se está reimplantado.' };
  });

  return Promise.race([fetchPromise, timeoutPromise]);
}

var _tipEl = null;
function showTip(e, el) {
  var tip = el.getAttribute('data-tip');
  if (!tip) return;
  if (!_tipEl) {
    _tipEl = document.createElement('div');
    _tipEl.className = 'tooltip-popup';
    document.body.appendChild(_tipEl);
  }
  _tipEl.textContent = tip;
  _tipEl.classList.remove('visible');

  var rect = el.getBoundingClientRect();
  var tw = 280;
  var left = rect.left + rect.width / 2 - tw / 2;
  var top  = rect.top - 8;

  // Keep within viewport
  if (left < 8) left = 8;
  if (left + tw > window.innerWidth - 8) left = window.innerWidth - tw - 8;

  _tipEl.style.left = left + 'px';
  _tipEl.style.top  = top + 'px';
  _tipEl.style.transform = 'translateY(-100%)';
  _tipEl.style.width = tw + 'px';

  requestAnimationFrame(function() { _tipEl.classList.add('visible'); });
}
function hideTip() {
  if (_tipEl) _tipEl.classList.remove('visible');
}

  var rL = function(v) { return v==='sim'?'Sim':v==='par'?'Parcial':v==='nao'?'Nao':'—'; };

  var nl = '\n';

  var objResp  = OBJS.map(function(n,i){ return '  - ' + n + ': ' + rL(S.strat[ids[i]]); }).join(nl);
  var fcsIds   = ['F1','F2','F3','F4','F5','F6'];
  var fcsResp  = FCSS.map(function(n,i){ return '  - ' + n + ': ' + rL(S.strat[fcsIds[i]]); }).join(nl);
  var aveIds   = ['A1','A2','A3','A4'];
  var aveResp  = AVES.map(function(n,i){ return '  - ' + n + ': ' + rL(S.strat[aveIds[i]]); }).join(nl);
  var projIds  = ['P1','P2','P3','P4','P5','P6','P7','P8','P9','P10','P11','P12'];
  var projResp = PROJS.map(function(n,i){ return '  - ' + n + ': ' + rL(S.pmo[projIds[i]]); }).join(nl);
  var sustIds  = ['S1','S2','S3','S4','S5'];
  var sustResp = SUSTS.map(function(n,i){ return '  - ' + n + ': ' + rL(S.pmo[sustIds[i]]); }).join(nl);

  var systemPrompt = [
    'Voce e Marcos Andrade, especialista senior em gerenciamento de projetos com 18 anos de experiencia',
    'em grandes empresas de seguros e consorcios brasileiras como Porto Seguro, Bradesco Seguros, MAPFRE e Sul America.',
    'Voce conhece profundamente o setor: ciclos regulatorios, SUSEP, transformacao digital, gestao de riscos e eficiencia operacional.',
    'Sua comunicacao e direta, objetiva e estrategica.',
    'Voce DEVE pesquisar na internet por iniciativas similares de concorrentes e tendencias do setor antes de responder.',
    'Responda APENAS com JSON valido, sem markdown, sem texto fora do JSON.'
  ].join(' ');

  var lines = [
    'Analise a seguinte iniciativa e forneca seu parecer especializado.',
    '',
    '## INICIATIVA',
    'Nome: '         + (S.info.nome    || 'Nao informado'),
    'Area: '         + (S.info.area    || 'Nao informada'),
    'Gestor: '       + (S.info.gestor  || 'Nao informado'),
    'Descricao: '    + (S.info.desc    || 'Nao informada'),
    'Investimento: ' + (S.info.investimento || 'Nao informado'),
    'Tipo de Benefício: ' + (S.info.tipoBeneficio === 'receita' ? 'Aumento de Receita' : S.info.tipoBeneficio === 'reducao' ? 'Reducao de Despesa' : S.info.tipoBeneficio === 'evitado' ? 'Custo Evitado' : S.info.tipoBeneficio === 'saving' ? 'Saving' : 'Nao informado'),
    'Beneficio Mensal Estimado: ' + (S.info.receita || 'Nao informado'),
    'Duracao do Beneficio: ' + (S.info.duracaoBeneficio ? S.info.duracaoBeneficio + ' meses' : 'Nao informado'),
    'Beneficio Total Estimado: ' + (S.info.beneficioTotal || 'Nao informado'),
    'Tem Payback: ' + (S.info.temPayback === 'nao' ? 'Nao aplicavel' : 'Sim'),
    '',
    '## RESULTADO DA TRIAGEM PMO',
    'Enquadramento: '   + (pmoLabels[cls]||cls),
    'Resultado: '       + mat.text,
    'Score Estrategico: ' + sc.finalScore + '/100 — Nivel: ' + (nivLabels[stSt.level]||stSt.level),
    'Score Objetivos: ' + sc.objScore + '% | FCS: ' + sc.fcsScore + '% | Avenidas: ' + sc.aveScore + '%',
    'Score Projeto PMO: ' + p.proj.toFixed(1) + '/76 | Sustentacao: ' + p.sust.toFixed(1) + '/40',
    'Triggers: ' + p.triggers + '/5 | Escalonamento: ' + (mat.esc?'OBRIGATORIO':'Nao necessario'),
    '',
    '## RESPOSTAS',
    '### Objetivos Estrategicos', objResp,
    '### Fatores Criticos de Sucesso', fcsResp,
    '### Avenidas de Crescimento', aveResp,
    '### Dimensoes de Projeto', projResp,
    '### Dimensoes de Sustentacao', sustResp,
    '',
    '## FORMATO DE RESPOSTA',
    'Responda SOMENTE com este JSON (sem markdown, sem backticks):',
    '{"avaliacao_geral":"...","aderencia_setor":"...","benchmarking":"...","riscos":"...","recomendacao":"AVANCAR ou REVISAR ou REPENSAR","recomendacao_justificativa":"...","fontes":["url1"]}'
  ];

  return { systemPrompt: systemPrompt, userPrompt: lines.join(nl) };
}


function callGeminiInsights() {
  var el = document.getElementById('ai-insights-body');
  if (!el) return;

  // Build payload
  var sc   = calcStrat();
  var p    = calcPMO();
  var cls  = classifyPMO(p.proj, p.sust, p.triggers, p.parciais, p.respondidas);
  var stSt = stratStatus(sc.finalScore);
  var mat  = (MATRIX[stSt.level]||{})[cls] || { text:'Indefinido', esc:false, acao:'' };
  var pmoLabels = { projeto:'PROJETO', sustentacao:'SUSTENTAÇÃO', melhoria:'MELHORIA CONTÍNUA', pmo:'AVALIAÇÃO PMO', vazio:'—' };
  var nivLabels = { max:'Máxima (>=80)', high:'Alta (60-79)', mid:'Média (40-59)', low:'Baixa (<40)' };

  // Build respostas object
  var respostas = {};
  var allIds = ['O1','O2','O3','O4','O5','O6','O7','F1','F2','F3','F4','F5','F6','A1','A2','A3','A4','P1','P2','P3','P4','P5','P6','P7','P8','P9','P10','P11','P12','S1','S2','S3','S4','S5'];
  allIds.forEach(function(id) {
    var isStrat = id.charAt(0) === 'O' || id.charAt(0) === 'F' || id.charAt(0) === 'A';
    respostas[id] = {
      resp: isStrat ? (S.strat[id]||'') : (S.pmo[id]||''),
      just: isStrat ? (S.stratJust[id]||'') : (S.pmoJust[id]||'')
    };
  });

  var data = {
    info:      S.info,
    scores:    { finalScore: sc.finalScore, objScore: sc.objScore, fcsScore: sc.fcsScore, aveScore: sc.aveScore, stratLevel: nivLabels[stSt.level]||stSt.level },
    pmo:       { enquadramento: pmoLabels[cls]||cls, scoreProj: p.proj.toFixed(1), scoreSust: p.sust.toFixed(1), triggers: p.triggers },
    result:    { texto: mat.text, acao: mat.acao, escalonamento: mat.esc },
    respostas: respostas
  };

  // Timeout
  var timeout = setTimeout(function() {
    el.innerHTML = '<div class="ai-error">Tempo esgotado. <button class="btn btn-secondary" onclick="callGeminiInsights()" style="font-size:12px;padding:6px 14px;margin-top:8px">Tentar novamente</button></div>';
  }, 30000);

  // Chamada via POST (evita o limite de tamanho de URL do JSONP/GET)
  fetch(APPS_SCRIPT_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ action: 'geminiInsights', data: data })
  })
  .then(function(res) { return res.json(); })
  .then(function(response) {
    clearTimeout(timeout);
    if (response && response.status === 'ok' && response.parecer) {
      renderInsights(el, response.parecer);
    } else {
      el.innerHTML = '<div class="ai-error">Erro ao obter análise da IA: ' + (response.message||'Resposta inválida') + '<br><button class="btn btn-secondary" onclick="callGeminiInsights()" style="font-size:12px;padding:6px 14px;margin-top:8px">Tentar novamente</button></div>';
    }
  })
  .catch(function() {
    clearTimeout(timeout);
    el.innerHTML = '<div class="ai-error">Erro de conexão com o Apps Script.<br><button class="btn btn-secondary" onclick="callGeminiInsights()" style="font-size:12px;padding:6px 14px;margin-top:8px">Tentar novamente</button></div>';
  });
}

function renderInsights(el, parecer) {
  var recClass = parecer.recomendacao === 'AVANCAR' ? 'ai-rec-avancar' : parecer.recomendacao === 'REVISAR' ? 'ai-rec-revisar' : 'ai-rec-repensar';
  var recLabel = parecer.recomendacao === 'AVANCAR' ? 'AVANÇAR' : parecer.recomendacao === 'REVISAR' ? 'REVISAR' : 'REPENSAR';
  var recIcon  = parecer.recomendacao === 'AVANCAR' ? '✓' : parecer.recomendacao === 'REVISAR' ? '⚠' : '✕';

  var html = '<div class="ai-recommendation ' + recClass + '">' + recIcon + ' ' + recLabel + '</div>';
  html += '<div style="font-size:13px;color:var(--text);line-height:1.7;margin-bottom:20px">' + (parecer.recomendacao_justificativa||'') + '</div>';

  var sections = [
    { icon: '🔍', title: 'Avaliação Geral', key: 'avaliacao_geral' },
    { icon: '🏢', title: 'Aderência ao Setor de Seguros e Consórcios', key: 'aderencia_setor' },
    { icon: '🌐', title: 'Benchmarking — Mercado e Concorrentes', key: 'benchmarking' },
    { icon: '⚠️', title: 'Riscos e Pontos de Atenção', key: 'riscos' },
  ];

  sections.forEach(function(s) {
    if (parecer[s.key]) {
      html += '<div class="ai-section">';
      html += '<div class="ai-section-title"><span class="ai-section-icon">' + s.icon + '</span>' + s.title + '</div>';
      html += '<div class="ai-content">' + parecer[s.key] + '</div>';
      html += '</div>';
    }
  });

  html += '<div class="ai-timestamp">Análise gerada em ' + new Date().toLocaleString('pt-BR') + ' · Gemini 1.5 Flash via PMO Apps Script</div>';
  el.innerHTML = html;
}


try {
  if (loadDraft()) {
    var __resumeEl = document.getElementById('app-content');
    if (__resumeEl) {
      // Mostra aviso de rascunho restaurado antes da renderização normal
      setTimeout(function() {
        var banner = document.createElement('div');
        banner.className = 'alert info';
        banner.style.marginBottom = '16px';
        banner.innerHTML = '📋 Rascunho anterior restaurado automaticamente. <button class="btn btn-secondary" style="margin-left:8px;font-size:11px;padding:4px 10px" onclick="clearDraft();resetAll()">Descartar e começar do zero</button>';
        __resumeEl.parentNode.insertBefore(banner, __resumeEl);
      }, 0);
    }
  }
  render();
} catch(err) {
  console.error('PMO RENDER ERROR:', err);
  document.getElementById('app-content').innerHTML =
    '<div style="padding:40px;color:red;font-family:monospace;font-size:12px">' +
    '<strong>Erro de inicialização:</strong><br>' + err.message +
    '<br><br>' + err.stack + '</div>';
}
